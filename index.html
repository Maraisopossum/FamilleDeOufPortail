<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Jeux de la Famille</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#1b1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jeux Famille">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="./shared/ui.css">
</head>
<body>
<canvas id="confetti"></canvas>
<button id="muteBtn" style="position:fixed;top:14px;right:14px;z-index:60;width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,200,87,0.4);background:#2a1b4d;color:#f6f2ff;font-size:16px;cursor:pointer;">🔊</button>

<div id="app"></div>

<script type="module">
import { startRouter, registerRoute, navigate } from "./shared/router.js";
import { getActiveProfile, activeProfileBadgeHtml, bindChangeProfileHandler, renderProfilePicker } from "./shared/profile.js";
import { renderHistoryScreen } from "./shared/history.js";

const appEl = document.getElementById("app");

function currentRoutePath() {
  const hash = location.hash || "#/";
  return hash.startsWith("#") ? hash.slice(1) : hash;
}

function topbarHtml(activeRoute) {
  const links = [
    { path: "/", label: "🏠 Accueil" },
    { path: "/quiz", label: "🐼 Quiz" },
    { path: "/naval", label: "🎯 Bataille navale" },
    { path: "/connect4", label: "🔴 Puissance 4" },
    { path: "/historique", label: "📊 Historique" }
  ];
  return `
    <div class="topbar">
      <div class="brand"><a href="#/">🎲 Les Jeux <span>de la Famille</span></a></div>
      <div class="topbar-right">
        <nav class="nav-links">
          ${links.map(l => `<a href="#${l.path}" class="${activeRoute === l.path ? "active" : ""}">${l.label}</a>`).join("")}
        </nav>
        <span id="profileBadgeSlot"></span>
      </div>
    </div>
  `;
}

function renderProfileBadge() {
  const slot = document.getElementById("profileBadgeSlot");
  if (slot) slot.innerHTML = activeProfileBadgeHtml();
}

bindChangeProfileHandler(document.body, () => {
  renderProfileBadge();
  // Si on est dans un écran de jeu, on le fait recharger pour qu'il redemande un profil.
  window.dispatchEvent(new HashChangeEvent("hashchange"));
});

/* ============ ACCUEIL ============ */
const GAMES = [
  { name: "Le Grand Quiz de la Tribu", desc: "Le quiz familial en équipe, en solo ou en tournoi", emoji: "🐼", route: "/quiz" },
  { name: "La bataille navale de la tribu", desc: "Les bateaux ça Margaux connaît, la destruction aussi, à toi de jouer", emoji: "🎯", route: "/naval" },
  { name: "Puissance 4 de la Tribu", desc: "Aligne 4 pions avant l'adversaire, en solo contre l'ordi ou en duel", emoji: "🔴", route: "/connect4" },
  { name: "Historique de la tribu", desc: "Tous les scores, tous les jeux confondus", emoji: "📊", route: "/historique" }
];

registerRoute("/", async (container) => {
  container.innerHTML = `
    ${topbarHtml("/")}
    <div class="header">
      <img src="./logo.png" alt="Logo de la famille">
      <h1>🎲 Les Jeux de la Famille</h1>
      <p>Choisis un jeu pour commencer</p>
    </div>
    <div class="game-grid" id="gameGrid"></div>
    <footer>Nouveau jeu à ajouter ? Édite la liste <code>GAMES</code> dans index.html.</footer>
  `;
  renderProfileBadge();
  const grid = container.querySelector("#gameGrid");
  grid.innerHTML = GAMES.map(g => {
    const isLive = !!g.route;
    return `
      <div class="game-card ${isLive ? "live" : "soon"}" ${isLive ? `data-goto="${g.route}"` : ""}>
        <span class="badge ${isLive ? "live" : "soon"}">${isLive ? "Disponible" : "Bientôt"}</span>
        <div class="emoji">${g.emoji}</div>
        <h3>${g.name}</h3>
        <p>${g.desc}</p>
      </div>
    `;
  }).join("");
  grid.addEventListener("click", (e) => {
    const card = e.target.closest("[data-goto]");
    if (card) navigate(card.dataset.goto);
  });
});

/* ============ HISTORIQUE ============ */
registerRoute("/historique", async (container) => {
  container.innerHTML = topbarHtml("/historique") + `<div id="historyMount"></div>`;
  renderProfileBadge();
  await renderHistoryScreen(container.querySelector("#historyMount"));
});

/* ============ QUIZ (chargement paresseux du module du jeu) ============ */
registerRoute("/quiz", async (container) => {
  container.innerHTML = topbarHtml("/quiz") + `<div id="gameMount"></div>`;
  renderProfileBadge();
  const mount = container.querySelector("#gameMount");
  if (!getActiveProfile()) {
    await renderProfilePicker(mount, () => { renderProfileBadge(); navigate("/quiz"); }, {
      title: "Qui joue au quiz ?",
      subtitle: "Choisis ton profil — il restera actif pour tous les jeux."
    });
    return;
  }
  const mod = await import("./games/quiz.js");
  return mod.mountQuiz(mount, { onChangeProfile: () => { navigate("/quiz"); } });
});

/* ============ BATAILLE NAVALE ============ */
registerRoute("/naval", async (container) => {
  container.innerHTML = topbarHtml("/naval") + `<div id="gameMount"></div>`;
  renderProfileBadge();
  const mount = container.querySelector("#gameMount");
  if (!getActiveProfile()) {
    await renderProfilePicker(mount, () => { renderProfileBadge(); navigate("/naval"); }, {
      title: "Qui prend la barre ?",
      subtitle: "Choisis ton profil — il restera actif pour tous les jeux."
    });
    return;
  }
  const mod = await import("./games/naval.js");
  return mod.mountNaval(mount, { onChangeProfile: () => { navigate("/naval"); } });
});

/* ============ PUISSANCE 4 ============ */
registerRoute("/connect4", async (container) => {
  container.innerHTML = topbarHtml("/connect4") + `<div id="gameMount"></div>`;
  renderProfileBadge();
  const mount = container.querySelector("#gameMount");
  if (!getActiveProfile()) {
    await renderProfilePicker(mount, () => { renderProfileBadge(); navigate("/connect4"); }, {
      title: "Qui aligne les pions ?",
      subtitle: "Choisis ton profil — il restera actif pour tous les jeux."
    });
    return;
  }
  const mod = await import("./games/connect4.js");
  return mod.mountConnect4(mount, { onChangeProfile: () => { navigate("/connect4"); } });
});

registerRoute("__notfound__", null);

startRouter(appEl);
window.addEventListener("hashchange", renderProfileBadge);

/* ============ SON (mute global, partagé par les deux jeux) ============ */
window.soundMuted = localStorage.getItem("fdo_sound_muted") === "1";
function updateMuteBtn() {
  document.getElementById("muteBtn").textContent = window.soundMuted ? "🔇" : "🔊";
}
document.getElementById("muteBtn").addEventListener("click", () => {
  window.soundMuted = !window.soundMuted;
  localStorage.setItem("fdo_sound_muted", window.soundMuted ? "1" : "0");
  updateMuteBtn();
});
updateMuteBtn();

/* ============ CONFETTI (partagé) ============ */
const confettiCanvas = document.getElementById("confetti");
const cctx = confettiCanvas.getContext("2d");
let confettiParticles = [];
let confettiRunning = false;
function resizeCanvas(){ confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight; }
window.addEventListener("resize", resizeCanvas); resizeCanvas();
window.burstConfetti = function burstConfetti(count){
  count = count || 110;
  const colors = ["#ff5d73","#ffc857","#3ddc97","#5b8dee","#f6f2ff"];
  for(let i=0;i<count;i++){
    confettiParticles.push({ x: innerWidth/2 + (Math.random()-0.5)*200, y: innerHeight*0.3,
      vx: (Math.random()-0.5)*10, vy: Math.random()*-9 - 2, size: Math.random()*8+4,
      color: colors[Math.floor(Math.random()*colors.length)], rot: Math.random()*360,
      vrot: (Math.random()-0.5)*10, life: 0 });
  }
  if(!confettiRunning){ confettiRunning = true; animateConfetti(); }
};
function animateConfetti(){
  cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
  confettiParticles.forEach(p=>{
    p.vy += 0.28; p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life++;
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot*Math.PI/180);
    cctx.fillStyle = p.color; cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); cctx.restore();
  });
  confettiParticles = confettiParticles.filter(p=>p.y < innerHeight+50 && p.life < 400);
  if(confettiParticles.length>0){ requestAnimationFrame(animateConfetti); }
  else { confettiRunning = false; cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height); }
}
</script>
<script>
  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
